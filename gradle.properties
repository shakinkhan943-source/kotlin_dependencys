# AGP 9.4 needs JDK 17+; give the daemon enough heap for dependency resolution.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AGP 9 default, kept explicit so an accidental opt-out never sneaks back in:
# built-in Kotlin is what lets this project drop the kotlin-android plugin.
android.builtInKotlin=true
