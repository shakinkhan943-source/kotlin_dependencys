name: Build Compose dependency bundle

on:
  workflow_dispatch:
    inputs:
      compose_bom_version:
        description: "androidx.compose:compose-bom version (2026.06.01 -> Compose 1.11.4 / material3 1.4.0). NOTE: 2026.08.00+ (Compose 1.12) needs compile_sdk 37."
        default: "2026.06.01"
      kotlin_version:
        description: "Kotlin version the bundle is aligned with (must match the kotlin-stdlib the app ships)"
        default: "2.4.10"
      coroutines_version:
        description: "kotlinx-coroutines version the bundle is aligned with"
        default: "1.11.0"
      agp_version:
        description: "Android Gradle plugin version"
        default: "9.4.0"
      gradle_version:
        description: "Gradle version (AGP 9.4 requires >= 9.6.0)"
        default: "9.6.0"
      compile_sdk:
        description: "compileSdk level"
        default: "36"
  push:
    paths:
      - 'scripts/**'
      - 'compose-catalog/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-bundle.yml'

permissions:
  contents: write

  env:
  
  COMPOSE_BOM_VERSION: ${{ github.event.inputs.compose_bom_version || '2026.06.01' }}
  KOTLIN_VERSION: ${{ github.event.inputs.kotlin_version || '2.4.10' }}
  COROUTINES_VERSION: ${{ github.event.inputs.coroutines_version || '1.11.0' }}
  AGP_VERSION: ${{ github.event.inputs.agp_version || '9.4.0' }}
  GRADLE_VERSION: ${{ github.event.inputs.gradle_version || '9.6.0' }}
  ANDROID_COMPILE_SDK_LEVEL: ${{ github.event.inputs.compile_sdk || '36' }}
  ANDROID_MIN_SDK_LEVEL: '26'
  BUILD_TOOLS_VERSION: '36.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;${BUILD_TOOLS_VERSION}"
          # The requested platform may not be in the runner's sdkmanager channel
          # yet; AGP downloads it on demand, and build_bundle.py falls back to
          # the highest installed platform for android.jar.
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK_LEVEL}" \
            || echo "platforms;android-${ANDROID_COMPILE_SDK_LEVEL} unavailable, AGP will fetch it"
          sdkmanager "platforms;android-36" || true
          
      - name: Build bundle
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          
        run: python3 scripts/build_bundle.py

      # Downloadable from the run's "Artifacts" section, kept for 90 days.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: compose-bundle
          path: |
            output/compose-libs.zip
            output/compose-libraries.json
          if-no-files-found: error

      # Also published as a Release so `gh release download` / a stable
      # URL works, instead of having to open a specific run each time.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bundle-${{ github.run_number }}"
          gh release create "$TAG" \
            output/compose-libs.zip output/compose-libraries.json \
            --title "Compose bundle #${{ github.run_number }}" \
            --notes "Generated from commit ${{ github.sha }} (Gradle ${GRADLE_VERSION}, AGP ${AGP_VERSION}, Kotlin ${KOTLIN_VERSION}, compose-bom ${COMPOSE_BOM_VERSION})" \
            --latest
